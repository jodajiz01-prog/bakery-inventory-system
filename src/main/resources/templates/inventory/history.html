<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historial de movimientos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container pb-5">
    <h1 class="mb-4">Historial de movimientos</h1>
    <form th:action="@{/inventory/history}" method="get" class="row g-2 mb-4 bg-white p-3 rounded shadow-sm">
        <div class="col-md-4">
            <label class="form-label">Producto</label>
            <select name="productId" class="form-select">
                <option value="">Todos</option>
                <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name}"
                        th:selected="${p.id == selectedProductId}"></option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label">Desde</label>
            <input type="date" name="startDate" class="form-control" th:value="${startDate}">
        </div>
        <div class="col-md-3">
            <label class="form-label">Hasta</label>
            <input type="date" name="endDate" class="form-control" th:value="${endDate}">
        </div>
        <div class="col-md-2 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">Filtrar</button>
        </div>
    </form>

    <table class="table table-bordered bg-white">
        <thead class="table-dark">
        <tr>
            <th>Fecha</th>
            <th>Producto</th>
            <th>Tipo</th>
            <th>Cantidad</th>
            <th>Usuario</th>
            <th>Nota</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="m : ${movements}">
            <td th:text="${#temporals.format(m.date, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${m.product.name}"></td>
            <td>
                <span th:if="${m.type.name() == 'ENTRADA'}" class="badge bg-success">Entrada</span>
                <span th:if="${m.type.name() == 'SALIDA'}" class="badge bg-danger">Salida</span>
            </td>
            <td th:text="${m.quantity}"></td>
            <td th:text="${m.username}"></td>
            <td th:text="${m.note}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
