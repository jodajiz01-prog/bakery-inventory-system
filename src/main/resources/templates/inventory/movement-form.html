<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrar movimiento</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container pb-5">
    <h1>Registrar movimiento — <span th:text="${product.name}"></span></h1>
    <p class="text-muted">Stock actual: <strong th:text="${product.stockQuantity}"></strong></p>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/inventory/movement}" method="post" class="bg-white p-4 rounded shadow-sm" style="max-width: 500px;">
        <input type="hidden" name="productId" th:value="${product.id}"/>

        <div class="mb-3">
            <label class="form-label">Tipo de movimiento</label>
            <select name="type" class="form-select" required>
                <option value="ENTRADA">Entrada (llegó mercadería)</option>
                <option value="SALIDA">Salida (venta o merma)</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Cantidad</label>
            <input type="number" name="quantity" class="form-control" min="1" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Nota (opcional)</label>
            <input type="text" name="note" class="form-control" placeholder="Ej: tanda de la mañana">
        </div>

        <button type="submit" class="btn btn-primary">Registrar</button>
        <a th:href="@{/products}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
