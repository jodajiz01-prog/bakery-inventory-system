<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Productos — Panadería Los Ángeles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container pb-5">

    <div th:if="${not #lists.isEmpty(lowStockProducts)}" class="alert alert-warning">
        <strong>⚠️ Alerta de stock bajo:</strong>
        <span th:each="p, iter : ${lowStockProducts}">
            <span th:text="${p.name}"></span><span th:text="${!iter.last} ? ', ' : ''"></span>
        </span>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Productos</h1>
        <a th:href="@{/products/new}" class="btn btn-primary">+ Nuevo producto</a>
    </div>

    <table class="table table-bordered bg-white">
        <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Categoría</th>
            <th>Descripción</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Stock mínimo</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}" th:classappend="${product.stockQuantity <= product.minimumStock} ? 'table-danger'">
            <td th:text="${product.name}"></td>
            <td th:text="${product.category != null ? product.category.displayName : ''}"></td>
            <td th:text="${product.description}"></td>
            <td th:text="${'₡' + product.price}"></td>
            <td th:text="${product.stockQuantity}"></td>
            <td th:text="${product.minimumStock}"></td>
            <td>
                <a th:href="@{/inventory/movement/{id}(id=${product.id})}" class="btn btn-sm btn-info">Movimiento</a>
                <a sec:authorize="hasRole('JEFE')" th:href="@{/products/delete/{id}(id=${product.id})}" class="btn btn-sm btn-danger"
                      onclick="return confirm('¿Seguro que quieres borrar este producto?')">Borrar</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
