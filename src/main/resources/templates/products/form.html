<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <form th:action="@{/products/save}" th:object="${product}" method="post" class="bg-white p-4 rounded shadow-sm">
        <input type="hidden" th:field="*{id}"/>

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" th:field="*{name}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea th:field="*{description}" class="form-control"></textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Precio</label>
            <input type="number" step="0.01" th:field="*{price}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Cantidad en stock</label>
            <input type="number" th:field="*{stockQuantity}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Stock mínimo</label>
            <input type="number" th:field="*{minimumStock}" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Categoría</label>
            <select th:field="*{category}" class="form-select" required>
                <option value="">Selecciona una categoría</option>
                <option value="DULCE">Pan dulce</option>
                <option value="SALADO">Pan salado</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/products}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
